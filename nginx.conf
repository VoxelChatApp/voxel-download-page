# Same routes as vercel.json / .htaccess, for the Docker image served behind Dokploy's Traefik.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml text/plain;

    location ~ ^/(baixar|download|setup\.exe)/?$ {
        return 302 https://github.com/VoxelChatApp/voxel-download-page/releases/download/v1.0.130/Voxel-Setup-1.0.130.exe;
    }
    location ~ ^/(instagram|ig)/?$ { return 302 https://instagram.com/voxelchat; }
    location ~ ^/web/?$ { return 302 https://app.voxelchat.com.br/; }
    location ~ ^/suporte/?$ { return 302 /obrigado; }
    location ~ ^/(obrigado|feedback|teste)/?$ { try_files /obrigado.html =404; }
    location ~ ^/admin/?$ { try_files /admin.html =404; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ /\. { deny all; }
    location ~ ^/(Dockerfile|nginx\.conf|package\.json|README\.md|LICENSE|vercel\.json)$ { return 404; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
